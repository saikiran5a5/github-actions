name: Multiple jobs test
on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install cowsay
        run: sudo apt-get install cowsay -y

      - name: Run cowsay
        run: cowsay -f dragon "Jai Babu!" > cowsaid.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dragon-text-file
          path: ./cowsaid.txt

  second_job:
    needs: first_job
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: dragon-text-file

      - name: View file
        run: cat cowsaid.txt

      - name: grep from file
        run: grep "Jai Babu!" cowsaid.txt
