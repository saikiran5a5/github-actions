name: variables & secrets test

on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

jobs:
  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - run: echo "docker build -t staging-image:latest ."

  docker_push:
    needs: docker_build
    name: Push to docker hub
    runs-on: ubuntu-latest
    steps:
      - run: echo "docker tag staging-image:latest ${{ github.repository_owner }}/staging-image:latest"
      - run: echo "echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username $GITHUB_ACTOR --password-stdin"
