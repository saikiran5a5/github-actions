name: Matrix test workflow

on:
  push:
    branches: ["main"]

jobs:
  docker-run:
    name: Docker run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, windows-latest, macos-latest]
        image: [hello-world, alpine]
        exclude:
          - image: alpine
            os: [windows-latest, macos-latest]
          - image: hello-world
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Run docker image
        run: docker run ${{ matrix.image }}
