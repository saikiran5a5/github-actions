name: Build and test on alpine

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-alpine:
    name: Build on alpine container (for musl binaries)
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build on container
        run: |
          docker run --rm \
          -v .:/workspace -w /workspace \
          ghcr.io/saikiran5a5/alpine-builder:latest \
          sh -c "
                  python -m nuitka \
                  --standalone \
                  --onefile \
                  --lto=yes \
                  --enable-plugin=anti-bloat \
                  --include-data-dir=templates=templates \
                  --assume-yes-for-downloads \
                  --remove-output \
                  --output-filename=mint \
                  main.py 
                "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mint-${{ matrix.os }}
          path: ./mint*
        

  test-alpine:
    needs: [build-alpine]
    name: Test the build artifacts on matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: mint-${{ matrix.os }}

      - name: Make executable
        run: chmod +x ./mint*

      - name: Test on container
        run: |
          docker run --rm \
          -v .:/workspace -w /workspace \
          ghcr.io/saikiran5a5/alpine-builder:latest \
          ./mint --help
